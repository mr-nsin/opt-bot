name: Build installers (Windows + macOS)

on:
  push:
    branches: [main, master, opt-bot]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install trading-engine Python deps
        run: |
          pip install pyinstaller ibapi pandas numpy pytz

      - name: Build trading-engine sidecar (.exe)
        run: python trading-engine/build.py

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (exe + installer)
        run: npm run tauri build

      - name: Upload Windows bundle (installer + exe)
        uses: actions/upload-artifact@v4
        with:
          name: QuantDrift-Windows
          path: |
            src-tauri/target/release/bundle/nsis/
            src-tauri/target/release/bundle/msi/

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install trading-engine Python deps
        run: |
          pip install pyinstaller ibapi pandas numpy pytz

      - name: Build trading-engine sidecar (macOS binary)
        run: python trading-engine/build.py

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (.app + DMG)
        run: npm run tauri build

      - name: Upload macOS bundle (DMG + app)
        uses: actions/upload-artifact@v4
        with:
          name: QuantDrift-macOS
          path: |
            src-tauri/target/release/bundle/dmg/
            src-tauri/target/release/bundle/macos/
